plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.phihonghugh.couplecheckin'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.phihonghugh.couplecheckin'
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "1.3"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
